[build-system]
requires = ["setuptools>=77", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "falling_trees"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.64",
]

[tool.setuptools]
packages = ["falling_trees"]
